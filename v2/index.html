<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#122e30"/><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%273%27 y=%277%27 width=%2726%27 height=%2722%27 rx=%276%27 fill=%27%23f1bd4b%27/%3E%3Cpath d=%27M16 2v17%27 stroke=%27%23203b3d%27 stroke-width=%276%27/%3E%3C/svg%3E"/><title>Furnace Born</title></head>
  <body>
    <canvas id="game" aria-label="游戏画面"></canvas>
    <div id="vignette"></div><div id="damage"></div><div id="iris"></div>
    <div id="hud">
      <button id="settings-button" class="icon-button" aria-label="打开设置"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <div id="boss-health"><i></i><div><span></span></div><i></i></div>
      <div id="minimap-wrap"><canvas id="minimap" width="256" height="256"></canvas><div class="map-corners"></div></div>
      <div id="status">
        <div class="status-icon"><svg viewBox="0 0 40 40"><path d="M10 12h20l5 8-5 10H10L5 20z"/><path d="M16 14v12m8-12v12M12 20h16"/></svg></div>
        <div class="meters"><div id="hp"></div><div class="heat-row"><svg viewBox="0 0 16 20"><path d="M7 1c6 8-3 7 3 12 1-3 3-4 3-4 6 11-11 15-11 4 0-5 5-6 5-12z"/></svg><div id="heat"><span></span></div></div><div id="overdrive"><svg viewBox="0 0 20 20"><path d="m11 0-8 11h6L7 20l10-12h-7z"/></svg><div><span></span></div></div></div>
      </div>
      <div id="glyphs"><kbd>W</kbd><span><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><svg viewBox="0 0 24 32"><rect x="4" y="2" width="16" height="28" rx="8"/><path d="M12 2v11H4"/></svg><kbd>Tab</kbd></div>
      <div id="interaction"><kbd>E</kbd></div><div id="acquired"><svg viewBox="0 0 48 48"><path d="m27 2-19 26h15l-3 18 22-27H27z"/></svg><kbd>Shift</kbd></div>
      <div id="reticle"><i></i><i></i><i></i><i></i><b></b></div>
    </div>
    <div id="region" hidden><canvas id="region-map"></canvas><button class="icon-button close-map" aria-label="关闭地图">×</button></div>
    <div id="settings" class="overlay" hidden>
      <section class="panel"><div class="eyebrow">FURNACE BORN</div><h1>系统设置</h1><p class="subtitle">一台被遗弃的机器，一条离开熔炉的路。</p>
        <div class="settings-grid"><div class="options"><label>主音量<input id="volume" type="range" min="0" max="1" step="0.05" value="0.55"/></label><label>音乐<input id="music" type="checkbox" checked/></label><label>音效<input id="sfx" type="checkbox" checked/></label><label>画面质量<select id="quality"><option value="high">高</option><option value="low">流畅</option></select></label><label>全屏<button id="fullscreen">切换</button></label><button id="reset-bindings" class="secondary">恢复默认按键</button></div><div><h2>操作绑定</h2><div id="bindings"></div><p class="binding-note">点击按键后，按任意键或鼠标键重新绑定。</p></div></div>
        <div class="panel-footer"><button id="new-game" class="secondary">重新开始</button><button id="resume" class="primary">继续游戏 <span>↗</span></button></div><p id="reset-confirm" hidden>再次点击“重新开始”将清除本地进度。</p>
      </section>
    </div>
    <div id="completion" class="overlay" hidden><section class="panel completion-panel"><div class="completion-symbol">✦</div><div class="eyebrow">FURNACE BORN</div><h1>抵达光的另一侧</h1><p class="subtitle">第一关已完成。进度已保存在此设备。</p><button id="return-game" class="primary">返回工厂</button><button id="replay" class="secondary">重新开始</button></section></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
