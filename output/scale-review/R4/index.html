oving-inspection.webp"><img width="2052" height="630" loading="lazy" src="controls--proving-inspection.webp" alt="试验区检查门闩：改前和改后驾驶画面"></a></figure><figure id="controls--overseer-service"><figcaption>试验场维修回程门闩 <span class="meta">overseer-service</span></figcaption><a href="controls--overseer-service.webp"><img width="2052" height="630" loading="lazy" src="controls--overseer-service.webp" alt="试验场维修回程门闩：改前和改后驾驶画面"></a></figure><h2>登车与停层标记</h2><figure id="lifts--inspection-load"><figcaption>检查线悬载平台 <span class="meta">inspection-load</span></figcaption><a href="lifts--inspection-load.webp"><img width="2052" height="630" loading="lazy" src="lifts--inspection-load.webp" alt="检查线悬载平台：改前和改后驾驶画面"></a></figure><h2>装备</h2><figure id="pickups--armor-proving"><figcaption>试车道装甲安装台 <span class="meta">armor-proving</span></figcaption><a href="pickups--armor-proving.webp"><img width="2052" height="630" loading="lazy" src="pickups--armor-proving.webp" alt="试车道装甲安装台：改前和改后驾驶画面"></a></figure><figure id="pickups--mortar-charge"><figcaption>迫击炮强化安装台 <span class="meta">mortar-charge</span></figcaption><a href="pickups--mortar-charge.webp"><img width="2052" height="630" loading="lazy" src="pickups--mortar-charge.webp" alt="迫击炮强化安装台：改前和改后驾驶画面"></a></figure><figure id="pickups--phoenix"><figcaption>凤凰引擎安装台 <span class="meta">phoenix</span></figcaption><a href="pickups--phoenix.webp"><img width="2052" height="630" loading="lazy" src="pickups--phoenix.webp" alt="凤凰引擎安装台：改前和改后驾驶画面"></a></figure><nav><a href="../index.html">返回七区总览</a></nav></body></html>
