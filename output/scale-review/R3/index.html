oundry.webp"><img width="2052" height="630" loading="lazy" src="pickups--armor-foundry.webp" alt="机械花旁装甲安装台：改前和改后驾驶画面"></a></figure><figure id="pickups--armor-reservoir"><figcaption>水库码头装甲安装台 <span class="meta">armor-reservoir</span></figcaption><a href="pickups--armor-reservoir.webp"><img width="2052" height="630" loading="lazy" src="pickups--armor-reservoir.webp" alt="水库码头装甲安装台：改前和改后驾驶画面"></a></figure><figure id="pickups--flotation"><figcaption>浮渡底盘安装台 <span class="meta">flotation</span></figcaption><a href="pickups--flotation.webp"><img width="2052" height="630" loading="lazy" src="pickups--flotation.webp" alt="浮渡底盘安装台：改前和改后驾驶画面"></a></figure><h2>侧线机关</h2><figure id="puzzles--gutter-a"><figcaption>第一组分水槽把手 <span class="meta">gutter-a</span></figcaption><a href="puzzles--gutter-a.webp"><img width="2052" height="630" loading="lazy" src="puzzles--gutter-a.webp" alt="第一组分水槽把手：改前和改后驾驶画面"></a></figure><figure id="puzzles--gutter-b"><figcaption>第二组分水槽把手 <span class="meta">gutter-b</span></figcaption><a href="puzzles--gutter-b.webp"><img width="2052" height="630" loading="lazy" src="puzzles--gutter-b.webp" alt="第二组分水槽把手：改前和改后驾驶画面"></a></figure><figure id="puzzles--gutter-plug"><figcaption>排水堵头释放把手 <span class="meta">gutter-plug</span></figcaption><a href="puzzles--gutter-plug.webp"><img width="2052" height="630" loading="lazy" src="puzzles--gutter-plug.webp" alt="排水堵头释放把手：改前和改后驾驶画面"></a></figure><h2>完成提示</h2><figure id="landmarks--garden-bloom"><figcaption>复水后完全展开的机械花 <span class="meta">garden-bloom</span></figcaption><a href="landmarks--garden-bloom.webp"><img width="2052" height="630" loading="lazy" src="landmarks--garden-bloom.webp" alt="复水后完全展开的机械花：改前和改后驾驶画面"></a></figure><nav><a href="../index.html">返回七区总览</a></nav></body></html>
