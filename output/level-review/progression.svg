<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1430" viewBox="0 0 1080 1430" role="img" aria-labelledby="title desc">
<title id="title">七区能力门与回访图</title><desc id="desc">从 A 的熔炉间开始，在 B 分成三条可换序的能力路线，于试验场汇合，获得 Phoenix 后回原橙门。C 之后通过光路和热道下行至 D 与最终炉心。右侧列举每段从哪一侧打开回访。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#192c2a}.h{font-size:30px;font-weight:700}.b{font-size:19px;font-weight:650}.t{font-size:15px}.m{font-size:14px;fill:#546463}.key{font-size:14px;fill:#724623;font-weight:600}.ret{fill:#185b50}.phase{font-size:15px;fill:#645a45;font-weight:650}</style>
<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#576969"/></marker></defs>
<rect width="1080" height="1430" fill="#f8f6ef"/><text x="35" y="48" class="h" text-anchor="start">七区能力门与回访图</text><text x="35" y="80" class="t" text-anchor="start">箭头按进度阅读。三个中期分支可以换序；一次探索可以跨区，无须先回 B。</text><path d="M783 110 V1372" stroke="#c0c9c2"/><text x="32" y="119" class="phase" text-anchor="start">主路线与玩家要完成的动作</text><text x="799" y="119" class="phase" text-anchor="start">从远端打开的回访与价值</text><rect x="148" y="138" width="496" height="76" rx="9" fill="#dde5e3" stroke="#748681"/><text x="162" y="167" class="b" text-anchor="start">A　旧维修室 → 回收铸造厂（R1）</text><text x="162" y="191" class="m" text-anchor="start">顺带进入压机底层 → 西闸与东侧回收闸 → Scrap Ram</text><path d="M396 214 L396 237" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="148" y="238" width="496" height="79" rx="9" fill="#f1dfba" stroke="#748681"/><text x="162" y="267" class="b" text-anchor="start">Overdrive → 逆行原入口输送带</text><text x="162" y="291" class="m" text-anchor="start">拾取要求 Scrap Ram 胜利；第一项回报是重新走通旧路。</text><path d="M794 165 h18" stroke="#277566" stroke-width="2" stroke-dasharray="4 3"/><text x="822" y="171" class="b ret" text-anchor="start">R1 → A</text><text x="822" y="198" class="m" text-anchor="start">Boss 前可打开检修近路。</text><text x="822" y="220" class="m" text-anchor="start">死亡回最后激活的维修站；</text><text x="822" y="242" class="m" text-anchor="start">途经不等于激活。</text><path d="M396 317 L396 342" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="148" y="343" width="496" height="74" rx="9" fill="#dde5e3" stroke="#748681"/><text x="162" y="372" class="b" text-anchor="start">B　货运交换站（R2）</text><text x="162" y="396" class="m" text-anchor="start">先看见橙色隔墙与转轮，再选择轨道车间、货场或干滤床。</text><path d="M396 417 L396 443" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round"/><path d="M396 443 L142 443 L142 469" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M396 443 L396 443 L396 469" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M396 443 L650 443 L650 469" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="22" y="470" width="240" height="106" rx="9" fill="#f1dfba" stroke="#748681"/><text x="36" y="499" class="b" text-anchor="start">R2　轨道车间</text><text x="36" y="523" class="m" text-anchor="start">调道岔 → 车到泊位</text><text x="36" y="544" class="m" text-anchor="start">模块随检修桥下降</text><text x="36" y="565" class="m" text-anchor="start">获得磁力枪</text><rect x="276" y="470" width="240" height="106" rx="9" fill="#f1dfba" stroke="#748681"/><text x="290" y="499" class="b" text-anchor="start">R2　下层货场</text><text x="290" y="523" class="m" text-anchor="start">进入分拣机庭院</text><text x="290" y="544" class="m" text-anchor="start">击败 Sorter</text><text x="290" y="565" class="m" text-anchor="start">获得迫击炮</text><rect x="530" y="470" width="240" height="106" rx="9" fill="#f1dfba" stroke="#748681"/><text x="544" y="499" class="b" text-anchor="start">R3　沉没花园</text><text x="544" y="523" class="m" text-anchor="start">从干滤床抵达浮具</text><text x="544" y="544" class="m" text-anchor="start">下水并重新靠岸</text><text x="544" y="565" class="m" text-anchor="start">获得浮渡能力</text><path d="M794 393 h18" stroke="#277566" stroke-width="2" stroke-dasharray="4 3"/><text x="822" y="399" class="b ret" text-anchor="start">中段的三种回报</text><text x="822" y="426" class="m" text-anchor="start">磁力打开车间近门；</text><text x="822" y="448" class="m" text-anchor="start">Sorter 前开重试升降机；</text><text x="822" y="470" class="m" text-anchor="start">浮渡让花园接回旧岸。</text><path d="M142 576 L142 600 L396 600" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round"/><path d="M396 576 L396 600 L396 600" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round"/><path d="M650 576 L650 600 L396 600" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round"/><path d="M396 600 L396 626" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="108" y="627" width="576" height="92" rx="9" fill="#dde5e3" stroke="#748681"/><text x="122" y="656" class="b" text-anchor="start">R4　试验场入口（设计上的 AND）</text><text x="122" y="680" class="m" text-anchor="start">磁力拉栅 → 浮渡跨水 → 越过掩体打中配重顶面</text><text x="122" y="701" class="m" text-anchor="start">机关按工作面与地形收束路线；并无三项库存检查。</text><path d="M794 639 h18" stroke="#277566" stroke-width="2" stroke-dasharray="4 3"/><text x="822" y="645" class="b ret" text-anchor="start">R4 → B</text><text x="822" y="672" class="m" text-anchor="start">从内侧开检修门。近竞技场</text><text x="822" y="694" class="m" text-anchor="start">的服务回线应省掉水路、</text><text x="822" y="716" class="m" text-anchor="start">配重和已清过的接敌。</text><path d="M396 719 L396 741" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="148" y="742" width="496" height="77" rx="9" fill="#f1dfba" stroke="#748681"/><text x="162" y="771" class="b" text-anchor="start">Overseer → Phoenix → 返回 B 的橙墙</text><text x="162" y="795" class="m" text-anchor="start">在原来失败的一侧加速撞开隔墙，再进入 C。</text><path d="M396 819 L396 841" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="148" y="842" width="496" height="89" rx="9" fill="#dde5e3" stroke="#748681"/><text x="162" y="871" class="b" text-anchor="start">C　东部配给厅 → 天文台（R5）</text><text x="162" y="895" class="m" text-anchor="start">到发射器取激光 → 还原光路 → Guardian</text><text x="162" y="916" class="m" text-anchor="start">站在接收器旁不能代表从外侧能抵达那个射位。</text><path d="M794 850 h18" stroke="#277566" stroke-width="2" stroke-dasharray="4 3"/><text x="822" y="856" class="b ret" text-anchor="start">C → B / R5 → 花园</text><text x="822" y="883" class="m" text-anchor="start">C 侧释放跨层吊笼。可选</text><text x="822" y="905" class="m" text-anchor="start">花园光路恢复巡检升降机，</text><text x="822" y="927" class="m" text-anchor="start">连接旧岸与上层。</text><path d="M396 931 L396 954" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="148" y="955" width="496" height="92" rx="9" fill="#f1dfba" stroke="#748681"/><text x="162" y="984" class="b" text-anchor="start">R6　循环工场</text><text x="162" y="1008" class="m" text-anchor="start">下到冷管线 → 安装 Circulation → 主动积热</text><text x="162" y="1029" class="m" text-anchor="start">红热且移动时突破热门；回到初次看见的深层通道。</text><path d="M794 971 h18" stroke="#277566" stroke-width="2" stroke-dasharray="4 3"/><text x="822" y="977" class="b ret" text-anchor="start">R6 → C / 花园</text><text x="822" y="1004" class="m" text-anchor="start">热桥升梯可回上层；冷通道</text><text x="822" y="1026" class="m" text-anchor="start">须先释放热桥，再打开旁通。</text><text x="822" y="1048" class="m" text-anchor="start">另有通往旧水系的压力回路。</text><path d="M396 1047 L396 1071" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="148" y="1072" width="496" height="91" rx="9" fill="#dde5e3" stroke="#748681"/><text x="162" y="1101" class="b" text-anchor="start">D　熔炉维修室 → 中央熔炉（R7）</text><text x="162" y="1125" class="m" text-anchor="start">击落供料配重，进入开出的工作面；</text><text x="162" y="1146" class="m" text-anchor="start">用固定镜接通馈线，返回 D 的另一侧。</text><path d="M794 1091 h18" stroke="#277566" stroke-width="2" stroke-dasharray="4 3"/><text x="822" y="1097" class="b ret" text-anchor="start">D → A</text><text x="822" y="1124" class="m" text-anchor="start">从深处释放旧升降井和</text><text x="822" y="1146" class="m" text-anchor="start">铸造厂门。重试终战时</text><text x="822" y="1168" class="m" text-anchor="start">应能绕过已经接通的供料线。</text><path d="M396 1163 L396 1185" fill="none" stroke="#576969" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="148" y="1186" width="496" height="73" rx="9" fill="#dfebd9" stroke="#748681"/><text x="162" y="1215" class="b" text-anchor="start">Keeper → 自行驶入停靠位</text><text x="162" y="1239" class="m" text-anchor="start">胜利改变现场；玩家在底座上主动停靠才结束。</text><text x="32" y="1318" class="phase" text-anchor="start">证据边界</text><text x="32" y="1349" class="t" text-anchor="start">金色节点为能力取得／首次关键使用。主线依据战利品、开关、实体阻挡及规范中的空间次序重建。</text><text x="32" y="1376" class="t" text-anchor="start">六种顺序已核对拾取逻辑；未将此结果作为六次完整驾驶通关。各门的硬条件与空间假设详见审查正文。</text></svg>