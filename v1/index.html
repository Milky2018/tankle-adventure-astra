<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1518" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23f6c94a%22/><path d=%22M13 37h38v12H13zM20 16h24v24H20z%22 fill=%22%23131b1e%22/><circle cx=%2226%22 cy=%2249%22 r=%225%22 fill=%22%23131b1e%22/><circle cx=%2239%22 cy=%2249%22 r=%225%22 fill=%22%23131b1e%22/></svg>" />
    <title>Rejected Prototype</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport" aria-label="3D tank game"></div>

      <div id="hud" class="hud hidden" aria-hidden="true">
        <div class="status-cluster">
          <div id="health-bar" class="segmented-bar health" aria-label="Hull integrity"></div>
        </div>
        <canvas id="minimap" width="180" height="180" aria-label="Minimap"></canvas>
        <div id="reticle" class="reticle"><i></i><b></b><span></span></div>
        <div id="heat-gauge" class="heat-gauge"><i></i></div>
        <div id="speed-gauge" class="speed-gauge"><i></i></div>
        <div id="boss-bar" class="boss-bar hidden"><i></i></div>
        <div id="input-hint" class="input-hint hidden"></div>
        <div id="damage-flash" class="damage-flash"></div>
      </div>

      <div id="region-map" class="region-map hidden" aria-hidden="true">
        <canvas width="900" height="620"></canvas>
      </div>

      <section id="title-screen" class="system-screen title-screen">
        <div class="title-mark" aria-hidden="true"><i></i><b></b><span></span></div>
        <p class="kicker">A TANK METROIDVANIA</p>
        <h1>REJECTED<br /><em>PROTOTYPE</em></h1>
        <div class="menu-actions">
          <button id="continue-button" type="button" class="primary hidden">CONTINUE</button>
          <button id="start-button" type="button" class="primary">NEW GAME</button>
          <button data-open-settings type="button">SETTINGS</button>
        </div>
      </section>

      <section id="pause-screen" class="system-screen panel-screen hidden">
        <div class="panel">
          <p class="kicker">SYSTEM PAUSED</p>
          <h2>MAINTENANCE<br />CONTROL</h2>
          <button id="resume-button" class="primary" type="button">RESUME</button>
          <button data-open-settings type="button">SETTINGS</button>
          <button id="restart-button" type="button">RESTART FROM HIVE</button>
          <button id="title-button" type="button">RETURN TO TITLE</button>
        </div>
      </section>

      <section id="settings-screen" class="system-screen panel-screen hidden">
        <div class="panel settings-panel">
          <p class="kicker">SYSTEM CONFIGURATION</p>
          <h2>SETTINGS</h2>
          <label>MASTER VOLUME <input id="volume-setting" type="range" min="0" max="1" step="0.05" value="0.7" /></label>
          <div id="key-bindings" class="key-bindings"></div>
          <button id="settings-back" class="primary" type="button">BACK</button>
        </div>
      </section>

      <section id="completion-screen" class="system-screen completion-screen hidden">
        <div class="completion-emblem" aria-hidden="true"><i></i><b></b></div>
        <p class="kicker">FIRST GATE OPEN</p>
        <h2>PROTOTYPE<br /><em>AWAKENED</em></h2>
        <button id="completion-restart" class="primary" type="button">PLAY AGAIN</button>
        <button id="completion-title" type="button">RETURN TO TITLE</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
